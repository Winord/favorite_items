modLoader = "javafml"
loaderVersion = "[1,)"
license = "All Rights Reserved"
issueTrackerURL = "https://github.com/Winord/FavoriteItems/issues"

[[mods]]
modId = "favoriteitems"
version = "${version}"
displayName = "Favorite Items"
authors = "Winord"
description = '''A client-side mod that provides Terraria-like Favorite Items System'''
logoFile = "icon.png"

[[mixins]]
config = "favoriteitems.mixins.json"

[[mixins]]
config = "favoriteitems.mixins.clientsort.json"

[[mixins]]
config = "favoriteitems.mixins.nemosinventorysorting.json"

[[mixins]]
config = "favoriteitems.mixins.ipn.json"

[[mixins]]
config = "favoriteitems.mixins.litematica.json"

[[dependencies.favoriteitems]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1,)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.favoriteitems]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.21.2)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.favoriteitems]]
    modId = "architectury"
    type = "required"
    versionRange = "[13,)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.favoriteitems]]
    modId = "cloth_config"
    type = "optional"
    versionRange = "[15,)"
    ordering = "NONE"
    side = "CLIENT"
