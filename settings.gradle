pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
    }
}

if (JavaVersion.current().ordinal() + 1 < 25) {
    throw new IllegalStateException("Please run Gradle with Java 25+ (Minecraft 26.2 requires it).")
}

rootProject.name = "favoriteitems"

include("common")
include("fabric")
include("neoforge")
